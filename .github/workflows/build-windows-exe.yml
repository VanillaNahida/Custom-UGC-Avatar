name: Build Windows EXE for Custom-UGC-Avatar

on:
  release:
    types: [published]
  workflow_dispatch:  # 允许手动触发构建

permissions:
  contents: write  # 用于上传到 releases

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30  # 设置超时时间
    
    steps:
    - name: Checkout code with tag information
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取所有历史记录以便获取标签
        
    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'  # 启用 pip 缓存
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        pip install nuitka==2.8.9 ordered-set zstandard
        
    - name: Extract version from tag using Python
      id: extract_version
      run: |
        python -c "
        import os
        import re
        
        # 方法1: 从 GITHUB_REF 环境变量提取
        github_ref = os.environ.get('GITHUB_REF', '')
        version = None
        
        if github_ref:
            match = re.match(r'refs/tags/(?:v?)(\d+(?:\.\d+)*)', github_ref)
            if match:
                version = match.group(1)
                print(f'Extracted version from GITHUB_REF: {version}')
        
        # 方法2: 从当前 Git 标签获取（作为备用）
        if not version:
            import subprocess
            try:
                # 获取最新的标签
                tag_result = subprocess.run(
                    ['git', 'describe', '--tags', '--abbrev=0'],
                    capture_output=True,
                    text=True,
                    check=False
                )
                if tag_result.returncode == 0:
                    tag = tag_result.stdout.strip()
                    if tag.startswith('v'):
                        version = tag[1:]
                    else:
                        version = tag
                    print(f'Extracted version from git tag: {version}')
            except Exception as e:
                print(f'Failed to get git tag: {e}')
        
        # 方法3: 从版本文件读取
        if not version:
            try:
                with open('version.txt', 'r') as f:
                    version = f.read().strip()
                    print(f'Read version from version.txt: {version}')
            except FileNotFoundError:
                pass
        
        # 最终回退方案
        if not version:
            version = '1.0.0'
            print(f'Using fallback version: {version}')
        
        # 验证版本号格式
        if not re.match(r'\d+(?:\.\d+)+', version):
            raise ValueError(f'Invalid version format: {version}')
        
        print(f'Final version: {version}')
        
        # 转换为 Nuitka 格式 (1.2.3 -> 1.2.3.0)
        parts = version.split('.')
        while len(parts) < 4:
            parts.append('0')
        parts = parts[:4]
        nuitka_version = '.'.join(parts)
        print(f'Nuitka version format: {nuitka_version}')
        
        # 设置输出变量
        print(f'::set-output name=version::{version}')
        print(f'::set-output name=nuitka_version::{nuitka_version}')
        "
        
    - name: Display version information
      run: |
        echo "Version: ${{ steps.extract_version.outputs.version }}"
        echo "Nuitka version format: ${{ steps.extract_version.outputs.nuitka_version }}"
        
    - name: Create directory for output
      run: |
        New-Item -ItemType Directory -Force -Path dist
        
    - name: Build executable with Nuitka
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"
        $nuitka_version = "${{ steps.extract_version.outputs.nuitka_version }}"
        
        Write-Host "Starting Nuitka build process..."
        Write-Host "Project version: $version"
        Write-Host "File version: $nuitka_version"
        
        # 先检查icon.ico文件是否存在
        if (-Not (Test-Path "icon.ico")) {
            Write-Host "Warning: icon.ico file not found, skipping icon option"
            $icon_option = ""
        } else {
            $icon_option = "--windows-icon-from-ico=icon.ico"
        }
        
        # 检查README.md文件是否存在
        if (-Not (Test-Path "README.md")) {
            Write-Host "Warning: README.md file not found, skipping include option"
            $readme_option = ""
        } else {
            $readme_option = "--include-data-file=README.md=README.md"
        }
        
        # 检查LICENSE文件是否存在
        if (-Not (Test-Path "LICENSE")) {
            Write-Host "Warning: LICENSE file not found, skipping include option"
            $license_option = ""
        } else {
            $license_option = "--include-data-file=LICENSE=LICENSE"
        }
        
        # 构建Nuitka命令
        $nuitkaArgs = @(
            "--onefile"
            "--windows-console-mode=enable"
            if ($icon_option) { $icon_option }
            "--enable-plugin=pyqt5"
            "--remove-output"
            "--assume-yes-for-downloads"
            "--output-dir=dist"
            "--copyright=VanillaNahida"
            "--company-name=VanillaNahida"
            "--lto=yes"
            "--onefile-tempdir-spec={TEMP}/avatar_$version"
            if ($license_option) { $license_option }
            if ($readme_option) { $readme_option }
            "--file-version=$nuitka_version"
            "--product-version=$nuitka_version"
            "--product-name=Custom-UGC-Avatar"
            "--file-description=Custom UGC Avatar"
            "./avatar_gui.py"
        )
        
        # 显示完整命令
        Write-Host "Nuitka command:"
        $command = "python -m nuitka " + ($nuitkaArgs -join ' ')
        Write-Host $command
        
        # 执行构建
        Write-Host "Starting Nuitka build..."
        
        # 执行Nuitka命令
        python -m nuitka @nuitkaArgs
        $exitCode = $LASTEXITCODE
        
        # 检查构建是否成功
        if ($exitCode -ne 0) {
            Write-Error "Nuitka build failed with exit code: $exitCode"
            exit $exitCode
        }
        
        # 验证是否生成了可执行文件
        $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe"
        if ($exeFiles.Count -eq 0) {
            Write-Error "Nuitka build completed but no executable file was generated in dist directory"
            exit 1
        }
        
        Write-Host "Nuitka build completed successfully!"
        
    - name: Verify generated executable
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"
        
        Write-Host "Looking for generated executable..."
        # 查找所有生成的可执行文件
        $exe_files = Get-ChildItem -Path "dist" -Filter "*.exe" | Sort-Object LastWriteTime -Descending
        
        if ($exe_files.Count -eq 0) {
            Write-Host "No executable files found in dist directory. Checking entire project..."
            $exe_files = Get-ChildItem -Path . -Recurse -Filter "*.exe" | Where-Object { $_.Name -notlike "*.dll" -and $_.Name -notlike "*.sys" } | Sort-Object LastWriteTime -Descending
            
            if ($exe_files.Count -eq 0) {
                Write-Error "No executable files found in project"
                exit 1
            }
        }
        
        # 使用最新生成的可执行文件
        $generated_exe = $exe_files[0]
        
        Write-Host "Executable found:"
        Write-Host "  Path: $($generated_exe.FullName)"
        Write-Host "  Name: $($generated_exe.Name)"
        Write-Host "  Size: $([math]::Round($generated_exe.Length / 1MB, 2)) MB"
        Write-Host "  Version: $version"
        
        # 设置环境变量以便后续步骤使用
        echo "GENERATED_EXE_PATH=$($generated_exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "GENERATED_EXE_NAME=$($generated_exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    - name: Rename executable
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"
        $generated_exe_path = "$env:GENERATED_EXE_PATH"
        $generated_exe_name = "$env:GENERATED_EXE_NAME"
        $destination = "dist\Custom-UGC-Avatar_$version.exe"
        
        Write-Host "Renaming from: $generated_exe_path"
        Write-Host "Renaming to: $destination"
        
        # 如果目标文件已存在，先删除
        if (Test-Path $destination) {
            Remove-Item $destination -Force
        }
        
        # 重命名文件
        Rename-Item -Path $generated_exe_path -NewName "Custom-UGC-Avatar_$version.exe" -Force
        
        # 验证新文件
        if (Test-Path $destination) {
            $size = [math]::Round((Get-Item $destination).Length / 1MB, 2)
            Write-Host "✓ Final executable ready: $destination ($size MB)"
        } else {
            Write-Error "Failed to rename executable"
            exit 1
        }
        
    - name: Create additional artifacts (optional)
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"
        
        # 创建包含文档和可执行文件的 ZIP 包
        $zipPath = "dist\Custom-UGC-Avatar_$version.zip"
        
        $filesToInclude = @()
        
        # 添加可执行文件
        if (Test-Path "dist\Custom-UGC-Avatar_$version.exe") {
            $filesToInclude += "dist\Custom-UGC-Avatar_$version.exe"
        }
        
        # 添加文档文件
        if (Test-Path "LICENSE") {
            $filesToInclude += "LICENSE"
        }
        
        if (Test-Path "README.md") {
            $filesToInclude += "README.md"
        }
        
        if (Test-Path "CHANGELOG.md") {
            $filesToInclude += "CHANGELOG.md"
        }
        
        if ($filesToInclude.Count -eq 0) {
            Write-Host "No files to include in ZIP package"
        } else {
            Compress-Archive -Path $filesToInclude -DestinationPath $zipPath -Force
            Write-Host "Created package: $zipPath"
        }
        
    - name: Upload standalone EXE as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-UGC-Avatar-Windows-${{ steps.extract_version.outputs.version }}
        path: |
          dist/Custom-UGC-Avatar_${{ steps.extract_version.outputs.version }}.exe
          dist/Custom-UGC-Avatar_${{ steps.extract_version.outputs.version }}.zip
        retention-days: 7
        
    - name: Upload to GitHub Release
      if: github.event_name == 'release'  # 仅当发布时上传到 Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        generate_release_notes: false
        draft: false
        prerelease: false
        files: |
          dist/Custom-UGC-Avatar_${{ steps.extract_version.outputs.version }}.exe
          dist/Custom-UGC-Avatar_${{ steps.extract_version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Clean up temporary files
      if: always()  # 总是运行清理步骤
      run: |
        Write-Host "Cleaning up temporary files..."
        # 删除 Nuitka 生成的中间文件
        Remove-Item -Path "__pycache__" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "*.build" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "*.dist" -Recurse -Force -ErrorAction SilentlyContinue
        
        # 清理可能生成的中间文件
        Remove-Item -Path "*.pyc" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "*.pyo" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "*.pyd" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "__pycache__" -Recurse -Force -ErrorAction SilentlyContinue
        
        Write-Host "Cleanup completed."